name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish package and create release
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          tag="v$version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump package.json to publish another release."
            exit 0
          fi

          existing_tag=$(git ls-remote origin "refs/tags/$tag")
          if [[ -n "$existing_tag" ]]; then
            echo "Tag $tag exists without a release. Choose an unused version." >&2
            exit 1
          fi

          npm_version=$(npm view "$package@$version" version --json || true)
          if [[ "$npm_version" != "\"$version\"" ]]; then
            npm publish
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes
